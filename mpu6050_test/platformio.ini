[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 80000000L

; Route Arduino's `Serial` to the native USB-Serial/JTAG port.
; Without these two flags `Serial` goes to UART0 on GPIO20/21, which is
; not connected to the USB socket, so every Serial.print() is invisible.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.3